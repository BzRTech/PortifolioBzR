<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script src="/js/sessao.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documento — BzR</title>
  <style>body{font-family:system-ui,sans-serif;background:#e9e7e1;color:#111;display:grid;place-items:center;min-height:100vh;margin:0}</style>
</head>
<body>
  <p id="msg">Carregando documento…</p>
  <script>
    // Busca o HTML do documento com o token da sessao (quando o login esta ligado)
    // e o exibe nesta janela, pronto para imprimir/salvar em PDF.
    (async function () {
      const p = new URLSearchParams(location.search);
      const url = p.get('previa') ? '/api/documentos/previa/relatorio-mensal?' + new URLSearchParams({ competencia: p.get('competencia') || '', municipio: p.get('municipio') || '' })
        : p.get('comprovante') ? '/api/requerimentos/' + encodeURIComponent(p.get('comprovante')) + '/comprovante'
        : '/api/documentos/' + encodeURIComponent(p.get('id') || '') + '/html';
      const headers = {};
      const t = localStorage.getItem('bzr_token');
      if (t) headers.Authorization = 'Bearer ' + t;
      try {
        const r = await fetch(url, { headers });
        if (r.status === 401) { location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search)); return; }
        const html = await r.text();
        if (!r.ok) throw new Error((JSON.parse(html || '{}').error) || r.statusText);
        document.open(); document.write(html); document.close();
      } catch (e) { document.getElementById('msg').textContent = 'Não foi possível abrir o documento: ' + e.message; }
    })();
  </script>
</body>
</html>
