<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/marca/favicon.svg" type="image/svg+xml" />
  <title>Validar documento — BzR</title>
  <meta name="description" content="Confira a autenticidade de certidões e declarações do cadastro imobiliário e acompanhe seu protocolo." />
  <script>try{var _t=localStorage.getItem('bzr-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/gestao.css" />
  <style>
    .pub { max-width: 640px; margin: 28px auto; padding: 0 16px 60px; }
    .pub h1 { font-size: 26px; margin: 6px 0 4px; letter-spacing: -.01em; }
    .pub .lead { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
    .res { margin-top: 16px; border: 1px solid var(--ink); padding: 16px; background: var(--card); border-top-right-radius: 18px; }
    .res.ok { border-left: 6px solid var(--verde-2); } .res.no { border-left: 6px solid var(--danger); }
    .res h3 { margin: 0 0 8px; font-size: 17px; }
    .res table { width: 100%; font-size: 13.5px; border-collapse: collapse; }
    .res th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px 4px 0; width: 38%; vertical-align: top; }
    .res td { padding: 4px 0; }
    .codigo { font: 700 18px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body class="gestao">
  <header class="topbar">
    <a class="brand" href="/" style="text-decoration:none;color:inherit"><img class="logo-img" src="/assets/bzr-mark.svg" alt="BzR" />
      <div class="brand-text"><strong>Validação de <span class="brand-accent">documentos</span></strong><small>Cadastro imobiliário municipal</small></div></a>
    <div class="top-actions"><button class="btn" data-theme-toggle onclick="BzrTheme.toggle()" title="Modo escuro" style="padding:9px 11px;font-size:15px;line-height:1">🌙</button></div>
  </header>
  <main class="pub">
    <div class="subtabs" id="st"><button class="on" data-s="doc">Validar documento</button><button data-s="prot">Consultar protocolo</button></div>
    <section data-v="doc">
      <h1>Este documento é autêntico?</h1>
      <p class="lead">Informe o código de validação impresso no rodapé da certidão ou declaração (ou leia o QR code).</p>
      <form class="toolbar2" id="f-doc"><input id="codigo" class="codigo" placeholder="XXXX-XXXX-XXXX" maxlength="14" autocomplete="off" style="flex:1" /><button class="b pri">Validar</button></form>
      <div id="r-doc"></div>
    </section>
    <section data-v="prot" hidden>
      <h1>Acompanhe seu requerimento</h1>
      <p class="lead">Informe o número do protocolo e o CPF/CNPJ do requerente.</p>
      <form class="f" id="f-prot"><label>Protocolo<input id="numero" placeholder="2026/00001" /></label><label>CPF/CNPJ do requerente<input id="doc" inputmode="numeric" /></label>
        <div class="full"><button class="b pri">Consultar</button></div></form>
      <div id="r-prot"></div>
    </section>
  </main>
  <script src="/js/theme.js"></script>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const data = (d) => (!d ? '—' : /^\d{4}-\d{2}-\d{2}$/.test(d) ? d.split('-').reverse().join('/') : new Date(d).toLocaleDateString('pt-BR'));
    const ST = { protocolado: 'Protocolado', em_analise: 'Em análise', pendente_documentacao: 'Pendente de documentação', deferido: 'Deferido', indeferido: 'Indeferido', concluido: 'Concluído', arquivado: 'Arquivado' };
    const aba = (s) => { document.querySelectorAll('#st button').forEach((b) => b.classList.toggle('on', b.dataset.s === s)); document.querySelectorAll('[data-v]').forEach((x) => (x.hidden = x.dataset.v !== s)); };
    document.querySelectorAll('#st button').forEach((b) => (b.onclick = () => aba(b.dataset.s)));

    async function validar(codigo) {
      const box = document.getElementById('r-doc');
      box.innerHTML = '<p class="dim">Consultando…</p>';
      try {
        const r = await fetch('/api/publico/validar/' + encodeURIComponent(codigo.trim()));
        const d = await r.json();
        if (!r.ok) { box.innerHTML = `<div class="res no"><h3>✕ Documento não encontrado</h3><p class="small">Confira o código digitado. Documentos falsificados não constam no registro da prefeitura.</p></div>`; return; }
        const motivo = d.status === 'cancelado' ? `Documento CANCELADO: ${esc(d.motivoCancelamento)}` : (!d.integro ? 'O conteúdo registrado não confere com o hash de integridade.' : (d.vencido ? 'Documento autêntico, porém com validade expirada.' : ''));
        box.innerHTML = `<div class="res ${d.valido ? 'ok' : 'no'}"><h3>${d.valido ? '✓ Documento autêntico e válido' : '⚠ ' + esc(motivo)}</h3>
          <table><tr><th>Documento</th><td><strong>${esc(d.titulo)}</strong> nº ${esc(d.numero)}</td></tr><tr><th>Órgão emissor</th><td>${esc(d.orgao)}</td></tr>
          ${d.inscricao ? `<tr><th>Inscrição imobiliária</th><td class="mono">${esc(d.inscricao)}</td></tr>` : ''}${d.interessado ? `<tr><th>Interessado</th><td>${esc(d.interessado)}</td></tr>` : ''}
          <tr><th>Emitido em</th><td>${new Date(d.emitidoEm).toLocaleString('pt-BR', { timeZone: 'America/Recife' })}</td></tr><tr><th>Validade</th><td>${data(d.validade)}</td></tr>
          <tr><th>Integridade</th><td>${d.integro ? 'conteúdo íntegro (SHA-256 confere)' : 'NÃO confere'}</td></tr></table>
          <p style="margin:12px 0 0"><a class="b" href="/api/publico/documento/${encodeURIComponent(d.codigo)}" target="_blank">Ver documento (dados pessoais mascarados) ↗</a></p></div>`;
      } catch (e) { box.innerHTML = `<div class="res no"><h3>Erro na consulta</h3><p>${esc(e.message)}</p></div>`; }
    }
    document.getElementById('f-doc').onsubmit = (e) => { e.preventDefault(); validar(document.getElementById('codigo').value); };
    document.getElementById('f-prot').onsubmit = async (e) => {
      e.preventDefault();
      const box = document.getElementById('r-prot');
      box.innerHTML = '<p class="dim">Consultando…</p>';
      try {
        const r = await fetch('/api/publico/protocolo?' + new URLSearchParams({ numero: document.getElementById('numero').value, doc: document.getElementById('doc').value }));
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.statusText);
        box.innerHTML = `<div class="res ok"><h3>Protocolo ${esc(d.numero)} · ${esc(ST[d.status] || d.status)}</h3>
          <table><tr><th>Assunto</th><td>${esc(d.assunto)}</td></tr><tr><th>Aberto em</th><td>${data(d.criadoEm)}</td></tr><tr><th>Prazo previsto</th><td>${data(d.prazo)}</td></tr>
          <tr><th>Última movimentação</th><td>${new Date(d.atualizadoEm).toLocaleString('pt-BR', { timeZone: 'America/Recife' })}</td></tr>${d.parecer ? `<tr><th>Parecer</th><td>${esc(d.parecer)}</td></tr>` : ''}</table>
          <div class="timeline" style="margin-top:12px">${d.historico.map((h) => `<div><strong>${esc(ST[h.status] || h.status)}</strong> · ${new Date(h.em).toLocaleString('pt-BR', { timeZone: 'America/Recife' })}</div>`).join('')}</div>
          ${d.documento ? `<p style="margin:12px 0 0">Documento emitido: <strong>${esc(d.documento.titulo)}</strong> nº ${esc(d.documento.numero)} · <a class="b sm" href="/api/publico/documento/${encodeURIComponent(d.documento.codigo)}" target="_blank">abrir ↗</a></p>` : ''}</div>`;
      } catch (err) { box.innerHTML = `<div class="res no"><h3>✕ ${esc(err.message)}</h3></div>`; }
    };
    const qs = new URLSearchParams(location.search);
    if (qs.get('codigo')) { document.getElementById('codigo').value = qs.get('codigo'); validar(qs.get('codigo')); }
    if (qs.get('protocolo')) { aba('prot'); document.getElementById('numero').value = qs.get('protocolo'); }
  </script>
</body>
</html>
