<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/marca/favicon.svg" type="image/svg+xml" />
  <title>BzR — Cadastro CIB/Sinter</title>
  <meta name="description" content="Implantação e manutenção contínua do cadastro imobiliário integrado ao Sinter e ao CIB." />
  <script>try{var _t=localStorage.getItem('bzr-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/gestao.css" />
</head>
<body class="gestao">
  <header class="topbar">
    <a class="brand" href="/" style="text-decoration:none;color:inherit">
      <img class="logo-img" src="/assets/bzr-mark.svg" alt="BzR" />
      <div class="brand-text">
        <strong>BzR <span class="brand-accent">CIB/Sinter</span></strong>
        <small>Cadastro imobiliário · Manutenção contínua</small>
      </div>
    </a>
    <div class="top-actions">
      <select id="muni" class="muni-sel" aria-label="Município" title="Município"></select>
      <nav class="nav-mods" aria-label="Módulos">
        <a class="btn" href="/territorio" title="Território (WebGIS)"><span class="ico">🗺</span> <span class="btn-label">Território</span></a>
        <a class="btn btn-primary" aria-pressed="true" href="/cib/" title="CIB/Sinter"><span class="ico">🏛</span> <span class="btn-label">CIB/Sinter</span></a>
        <a class="btn" href="/documentos/" title="Documentos e atendimento"><span class="ico">📄</span> <span class="btn-label">Documentos</span></a>
        <a class="btn" href="/bci/" title="Coleta de campo (BCI)"><span class="ico">🏠</span> <span class="btn-label">BCI</span></a>
        <a class="btn" href="/demandas/" title="Demandas da equipe"><span class="ico">🗂</span> <span class="btn-label">Demandas</span></a>
      </nav>
      <div class="userchip" id="userchip"></div>
      <button class="btn" id="btn-logout" hidden>Sair</button>
      <button class="btn" data-theme-toggle onclick="BzrTheme.toggle()" title="Modo escuro" style="padding:9px 11px;font-size:15px;line-height:1">🌙</button>
    </div>
  </header>

  <main class="g-wrap">
    <nav class="g-tabs" id="tabs" aria-label="Seções">
      <button data-tab="painel" class="on">▦ Painel</button>
      <button data-tab="imoveis">🏠 Imóveis <span class="badge" id="bd-imoveis"></span></button>
      <button data-tab="ciclo">🔄 Ciclo mensal <span class="badge" id="bd-ciclo"></span></button>
      <button data-tab="remessas">📤 Remessas</button>
      <button data-tab="conciliacao">⚖ Conciliação <span class="badge" id="bd-conciliacao"></span></button>
      <button data-tab="vistoria">🛰 Vistoria IA <span class="badge" id="bd-vistoria"></span></button>
      <button data-tab="implantacao">🧭 Implantação</button>
      <button data-tab="pgv">💲 PGV</button>
      <button data-tab="config">⚙ Município</button>
      <button data-tab="auditoria">🧾 Auditoria</button>
    </nav>
    <section id="view"><div class="vazio">Carregando…</div></section>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/gestao.js"></script>
  <script src="/cib/app.js"></script>
  <script src="/js/tour.js"></script>
  <script>
    BzrTour.init({
      id: 'cib', fabPos: 'bottom-right',
      title: 'Cadastro CIB/Sinter', emoji: '🏛️',
      intro: 'O módulo central: implantação do CIB e rotina mensal do cadastro com o Sinter. Quer um tour rápido?',
      steps: [
        { sel: '#muni', title: 'Município', text: 'Escolha o município. Cada prefeitura tem seu cadastro, suas remessas e sua configuração.' },
        { sel: '#tabs', title: 'Tudo num lugar só', text: 'Painel, imóveis, ciclo mensal, remessas, conciliação, vistoria por imagem, implantação, PGV e auditoria.' },
        { sel: '.ciclo', title: 'O ciclo mensal', text: 'Capturar → Validar → Transmitir → Conciliar → Prestar contas. Clique em cada passo para ir à fila de trabalho.' },
        { sel: '.prazo-bar', title: 'O prazo e o dia seguinte', text: 'A contagem até o prazo legal — e depois dele, a rotina continua mês a mês.' },
        { sel: null, title: 'Pronto! 🎉', text: 'Use "🎓 Tour" a qualquer momento para rever.' },
      ],
    });
  </script>
</body>
</html>
