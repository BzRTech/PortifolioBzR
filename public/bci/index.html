<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/bzr-mark.svg" type="image/svg+xml" />
  <title>BzR — Cadastro Imobiliário (BCI)</title>
  <script>try{var _t=localStorage.getItem('bzr-theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    html, body { height: 100%; }
    body { overflow: hidden; display: flex; flex-direction: column; }

    /* Layout principal */
    .main { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
    #mapa { height: 100%; width: 100%; background: var(--paper-2); }
    .maparea { position: relative; min-width: 0; }
    .map-legenda {
      position: absolute; left: 12px; bottom: 12px; z-index: 500;
      background: var(--card); border: 1px solid var(--line);
      padding: 9px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px;
      font-size: 11.5px; color: var(--muted); max-width: 70%;
    }
    .map-legenda span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.12); }

    /* Painel lateral */
    .side { border-left: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
    .resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
    .stat { background: var(--bg-elev); border: 1px solid var(--line); border-top: 3px solid var(--line-2); padding: 8px 11px; cursor: pointer; }
    .stat.on { border-top-color: var(--accent); }
    .stat .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; }
    .stat.total { grid-column: 1 / -1; }
    .stat.enviado .v { color: #5b8fd4; }
    .stat.aprovado .v { color: var(--ok); }
    .stat.ajuste .v { color: var(--warn); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; border-bottom: 1px solid var(--line); }
    .toolbar input, .toolbar select { background: var(--bg-elev); color: var(--text); border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; font-size: 13px; font-family: var(--font-ui); }
    .toolbar input { flex: 1; min-width: 120px; }
    .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
    .lista { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .bcard { background: var(--bg-elev); border: 1px solid var(--line); border-left: 3px solid var(--line-2); padding: 12px 13px; cursor: pointer; }
    .bcard:hover { border-color: var(--ink-2); }
    .bcard.hl { border-left-color: var(--accent); box-shadow: 0 0 0 1px rgba(26,26,26,.15); }
    .bcard .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .bcard .insc { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; }
    .bcard .loc { font-size: 11.5px; color: var(--text-dim); margin-bottom: 7px; }
    .bcard .foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--text-dim); }
    .bcard .abrir { margin-left: auto; color: var(--ink); font-weight: 700; text-decoration: none; font-size: 11.5px; border-bottom: 1px solid var(--line-2); }
    .bcard .abrir:hover { border-color: var(--ink); }
    .st-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; font-family: var(--font-mono); border: 1px solid; }
    .st-rascunho { color: var(--text-dim); border-color: var(--line); }
    .st-enviado { background: rgba(59,130,246,.1); color: #5b8fd4; border-color: rgba(59,130,246,.25); }
    .st-aprovado { background: rgba(62,125,68,.08); color: var(--ok); border-color: rgba(62,125,68,.25); }
    .st-rejeitado { background: rgba(180,53,30,.08); color: var(--danger); border-color: rgba(180,53,30,.25); }
    .st-arquivado { background: rgba(148,163,184,.1); color: var(--muted); border-color: rgba(148,163,184,.25); }
    .tag-aj { background: rgba(163,106,16,.08); color: var(--warn); font-size: 10px; font-weight: 700; padding: 2px 7px; border: 1px solid rgba(163,106,16,.25); font-family: var(--font-mono); }
    .empty { text-align: center; color: var(--text-dim); padding: 30px 16px; font-size: 12px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .1em; }
    .loading { padding: 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
    .leaflet-popup-content a { color: var(--ink); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--line-2); }
    .leaflet-control-layers { background: var(--card) !important; color: var(--ink) !important; border: 1px solid var(--line) !important; border-radius: 0 !important; box-shadow: var(--shadow) !important; }
    .leaflet-control-layers-expanded { padding: 8px 12px !important; font-size: 13px; }
    .leaflet-control-layers label { margin: 3px 0; }
    .leaflet-control-layers-selector { accent-color: var(--accent); margin-right: 6px; }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .main { grid-template-columns: 1fr; height: auto; }
      .maparea { height: 52vh; }
      .side { border-left: none; border-top: 1px solid var(--line); }
      .lista { overflow: visible; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/territorio" style="text-decoration:none;color:inherit">
      <img class="logo-img" src="/assets/bzr-mark.svg" alt="BzR" />
      <div class="brand-text">
        <strong>BzR <span class="brand-accent">Território</span></strong>
        <small>Geoprocessamento + Software para Gestão Pública</small>
      </div>
    </a>
    <div class="top-actions">
      <label class="field">
        <span>Município</span>
        <select id="municipio"></select>
      </label>
      <a class="btn" href="/territorio" title="Território"><span class="ico">🗺</span> <span class="btn-label">Território</span></a>
      <a class="btn" href="/demandas/" title="Gestão de Demandas"><span class="ico">🗂</span> <span class="btn-label">Demandas</span></a>
      <button class="btn btn-primary" aria-pressed="true" title="Cadastro (BCI)"><span class="ico">🏠</span> <span class="btn-label">Cadastro (BCI)</span></button>
      <a class="btn" href="/os/" title="Ordens de Serviço"><span class="ico">🛠</span> <span class="btn-label">Ordens de Serviço</span></a>
      <a class="btn" id="btn-novo" href="/bci/ficha.html">＋ <span class="btn-label">Novo BCI</span></a>
      <button class="btn" data-theme-toggle onclick="BzrTheme.toggle()" title="Modo escuro" style="padding:9px 11px;font-size:15px;line-height:1">🌙</button>
    </div>
  </header>

  <div class="main">
    <div class="maparea">
      <div id="mapa"></div>
      <div class="map-legenda">
        <span><i class="dot" style="background:#d7d3c6"></i>Sem coleta</span>
        <span><i class="dot" style="background:#9a978a"></i>Rascunho</span>
        <span><i class="dot" style="background:#5b8fd4"></i>Enviado</span>
        <span><i class="dot" style="background:#3E7D44"></i>Aprovado</span>
        <span><i class="dot" style="background:#B4351E"></i>Rejeitado</span>
        <span><i class="dot" style="background:#A36A10"></i>Ajuste geom.</span>
      </div>
    </div>

    <aside class="side">
      <div class="resumo" id="resumo"></div>
      <div class="toolbar">
        <input id="q" placeholder="Buscar inscrição…" />
        <select id="f-status">
          <option value="">Todos</option>
          <option value="rascunho">Rascunho</option><option value="enviado">Enviado</option>
          <option value="aprovado">Aprovado</option><option value="rejeitado">Rejeitado</option><option value="arquivado">Arquivado</option>
        </select>
        <label class="chk"><input type="checkbox" id="f-ajuste" /> Só ajustes</label>
      </div>
      <div class="lista" id="lista"><div class="loading">Carregando…</div></div>
    </aside>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/bci/app.js"></script>

  <script src="/js/tour.js"></script>
  <script>
    BzrTour.init({
      id: 'bci', fabPos: 'bottom-right',
      title: 'Cadastro Imobiliário (BCI)', emoji: '🏠',
      intro: 'Aqui você faz o Boletim de Cadastro Imobiliário dos lotes. Quer ver como funciona?',
      steps: [
        { sel: '#mapa', title: 'Os lotes da cidade', text: 'Cada lote aparece no mapa, colorido pelo status do cadastro. Clique num lote para começar (ou abrir) o BCI dele.' },
        { sel: '#resumo', title: 'Resumo do cadastro', text: 'Quantos BCIs aguardam aprovação, quantos foram aprovados e quantos lotes precisam de ajuste de geometria.' },
        { sel: '#lista', title: 'Lista de BCIs', text: 'Todos os boletins. Clique num item para o mapa voar até o lote; use "Abrir" para ver/editar o formulário.' },
        { sel: '#btn-novo', title: 'Novo BCI', text: 'Também dá para começar um cadastro do zero por aqui, digitando a inscrição do lote.' },
        { sel: null, title: 'Fluxo de aprovação', text: 'Cada BCI segue: Rascunho → Enviado → Aprovado (ou Rejeitado). O técnico coleta; a coordenação valida. Bom trabalho! 🎉' },
      ],
    });
  </script>
</body>
</html>
