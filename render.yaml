# Blueprint do Render (https://render.com/docs/blueprint-spec)
# UM SERVIÇO POR PREFEITURA (docs/adr/0001-um-deploy-por-prefeitura.md):
# duplique este serviço (e o banco no Neon) para cada município cliente.
# Com NODE_ENV=production o servidor NÃO sobe sem login, segredo forte,
# MUNICIPIO e PUBLIC_BASE_URL, e recusa qualquer flag de demonstração.
services:
  - type: web
    name: bzr-gestao-publica
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      # Município desta instância (obrigatório em produção). Ex.: "Tabira"
      - key: MUNICIPIO
        sync: false
      # Endereço público (https://…), impresso no QR de validação dos documentos.
      - key: PUBLIC_BASE_URL
        sync: false
      # Login obrigatório em produção.
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      # Admin criado no primeiro boot (senha com 12+ caracteres). Troque depois de entrar.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Pacote contratado: territorio, cib, documentos, bci, demandas, os, waze, api
      - key: MODULOS
        value: "cib,documentos,territorio,bci,demandas,api"
      # Troca de município (opcional): outras prefeituras da mesma equipe, cada uma no seu deploy.
      # Ex.: "Patos=https://patos.bzr.app.br; Sousa=https://sousa.bzr.app.br"
      - key: INSTANCIAS
        sync: false
      # Mesmo valor em todas as instâncias da lista (troca sem nova senha). Vazio = pede login.
      - key: SSO_SECRET
        sync: false
      # API do Sinter (credenciais do convênio). Sem elas, envio em lote (arquivo + idArquivo).
      - key: SINTER_AMBIENTE
        value: teste
      - key: SINTER_CLIENT_ID
        sync: false
      - key: SINTER_CLIENT_SECRET
        sync: false
      - key: ORTHO_TILE_URL
        sync: false
      # Senha da página de importação de camadas (/importar), além do login.
      - key: IMPORT_TOKEN
        sync: false
